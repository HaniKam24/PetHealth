    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    DocumentImportUploadError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [pet_name_mismatch]
          description: >-
            Present only when the upload was rejected because the document's stated patient
            name doesn't match the pet it was uploaded for. Lets the client single out this
            case (e.g. to show it as a prominent dialog) from the other reasons an upload can
            be rejected — too many pages, a scanned/image-only PDF, or a used-up import quota
            — which carry no code and are reported as an ordinary error message.
      required: [error]
    Pet:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        species: { type: string, enum: [dog, cat, rabbit, bird, fish, hamster, pig, horse, reptile, ferret, other] }
        breed: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        microchipId: { type: ["string", "null"] }
        sex: { type: string, enum: [female, male, unknown] }
        spayNeuterStatus: { type: string, enum: [spayed_neutered, intact, unknown] }
        birthDate: { type: ["string", "null"], format: date }
        gotchaDate: { type: ["string", "null"], format: date }
        weight: { type: ["number", "null"] }
        weightUnit: { type: string, enum: [lb, kg] }
        photoUrl: { type: ["string", "null"], format: uri }
        notes: { type: ["string", "null"] }
        allergies: { type: ["string", "null"] }
        vetName: { type: ["string", "null"] }
        vetClinic: { type: ["string", "null"] }
        vetPhone: { type: ["string", "null"] }
        vetAddress: { type: ["string", "null"] }
        criticalInfoSummary: { type: ["string", "null"] }
        criticalInfoDetails: { type: ["string", "null"] }
        feedingInstructions: { type: ["string", "null"] }
        whereThingsAre: { type: ["string", "null"] }
        walksAndTriggers: { type: ["string", "null"] }
        handlingNotes: { type: ["string", "null"] }
        whatNormalLooksLike: { type: ["string", "null"] }
        caretakingPreference: { type: ["string", "null"] }
        emergencyVetName: { type: ["string", "null"] }
        emergencyVetPhone: { type: ["string", "null"] }
        emergencyVetHours: { type: ["string", "null"] }
      required: [id, name, species, breed, color, microchipId, sex, spayNeuterStatus, birthDate, gotchaDate, weight, weightUnit, photoUrl, notes, allergies, vetName, vetClinic, vetPhone, vetAddress, criticalInfoSummary, criticalInfoDetails, feedingInstructions, whereThingsAre, walksAndTriggers, handlingNotes, whatNormalLooksLike, caretakingPreference, emergencyVetName, emergencyVetPhone, emergencyVetHours]
    PetInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        species: { type: string, enum: [dog, cat, rabbit, bird, fish, hamster, pig, horse, reptile, ferret, other] }
        breed: { type: ["string", "null"] }
        color: { type: ["string", "null"] }
        # Basic format check only (not a real registry lookup, see the
        # microchipId field on Pet above) — real chip numbers are 9-15
        # alphanumeric characters (15-digit ISO 11784/11785 is the most
        # common, but 9-digit and 10-character alphanumeric formats from
        # older registries like AVID/HomeAgain still exist in the wild).
        microchipId: { type: ["string", "null"], pattern: "^[A-Za-z0-9]{9,15}$" }
        sex: { type: string, enum: [female, male, unknown] }
        spayNeuterStatus: { type: string, enum: [spayed_neutered, intact, unknown] }
        birthDate: { type: ["string", "null"], format: date }
        gotchaDate: { type: ["string", "null"], format: date }
        weight: { type: ["number", "null"] }
        weightUnit: { type: string, enum: [lb, kg] }
        photoUrl: { type: ["string", "null"], format: uri }
        notes: { type: ["string", "null"] }
        allergies: { type: ["string", "null"] }
        vetName: { type: ["string", "null"] }
        vetClinic: { type: ["string", "null"] }
        vetPhone: { type: ["string", "null"] }
        vetAddress: { type: ["string", "null"] }
        criticalInfoSummary: { type: ["string", "null"] }
        criticalInfoDetails: { type: ["string", "null"] }
        feedingInstructions: { type: ["string", "null"] }
        whereThingsAre: { type: ["string", "null"] }
        walksAndTriggers: { type: ["string", "null"] }
        handlingNotes: { type: ["string", "null"] }
        whatNormalLooksLike: { type: ["string", "null"] }
        caretakingPreference: { type: ["string", "null"] }
        emergencyVetName: { type: ["string", "null"] }
        emergencyVetPhone: { type: ["string", "null"] }
        emergencyVetHours: { type: ["string", "null"] }
      required: [name, species, sex, spayNeuterStatus, weightUnit]
    PetUpdate:
      allOf:
        - $ref: "#/components/schemas/PetInput"
      description: Updated pet fields
    ShareLink:
      type: object
      description: An owner-facing view of a sitter/boarding share link — includes the full shareable URL, never the raw token alone (the URL is what gets copied/sent).
      properties:
        id: { type: integer }
        petId: { type: integer }
        url: { type: string, format: uri }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastViewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, petId, url, startsAt, expiresAt, lastViewedAt, createdAt]
    CreateShareLinkBody:
      type: object
      properties:
        startsAt: { type: ["string", "null"], format: date-time, description: "Defaults to now if omitted" }
        expiresAt: { type: string, format: date-time }
      required: [expiresAt]
    SitterReportMedication:
      type: object
      properties:
        name: { type: string }
        dose: { type: string }
        frequency: { type: string }
        instructions: { type: ["string", "null"] }
      required: [name, dose, frequency, instructions]
    SitterReport:
      type: object
      description: Still narrow — no health records, symptom journal, insights/chat history, weight logs, other pets, or owner account info. Widened once, deliberately, for the Sitter Brief fields below (criticalInfo* through emergencyVet*) plus a few identity facts (microchipId, sex, weight) a sitter/boarding facility genuinely needs, not anything about the owner's account.
      properties:
        petName: { type: string }
        species: { type: string, enum: [dog, cat, bird, rabbit, other] }
        sex: { type: string, enum: [female, male, unknown] }
        weight: { type: ["number", "null"] }
        weightUnit: { type: string, enum: [lb, kg] }
        microchipId: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"], format: uri }
        vetName: { type: ["string", "null"] }
        vetClinic: { type: ["string", "null"] }
        vetPhone: { type: ["string", "null"] }
        vetAddress: { type: ["string", "null"] }
        medications:
          type: array
          items:
            $ref: "#/components/schemas/SitterReportMedication"
        notes: { type: ["string", "null"] }
        criticalInfoSummary: { type: ["string", "null"] }
        criticalInfoDetails: { type: ["string", "null"] }
        feedingInstructions: { type: ["string", "null"] }
        whereThingsAre: { type: ["string", "null"] }
        walksAndTriggers: { type: ["string", "null"] }
        handlingNotes: { type: ["string", "null"] }
        whatNormalLooksLike: { type: ["string", "null"] }
        caretakingPreference: { type: ["string", "null"] }
        emergencyVetName: { type: ["string", "null"] }
        emergencyVetPhone: { type: ["string", "null"] }
        emergencyVetHours: { type: ["string", "null"] }
        expiresAt: { type: string, format: date-time }
      required: [petName, species, sex, weight, weightUnit, microchipId, photoUrl, vetName, vetClinic, vetPhone, vetAddress, medications, notes, criticalInfoSummary, criticalInfoDetails, feedingInstructions, whereThingsAre, walksAndTriggers, handlingNotes, whatNormalLooksLike, caretakingPreference, emergencyVetName, emergencyVetPhone, emergencyVetHours, expiresAt]
    HealthRecord:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        type: { type: string, enum: [visit, vaccine, lab, procedure, note] }
        title: { type: string }
        date: { type: string, format: date }
        clinic: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        # Populated only when documentType is "link" (an owner-pasted external
        # URL). For "upload", this is always null — the private storage path
        # is server-internal; call GET .../document-url for a viewable link.
        documentUrl: { type: ["string", "null"], format: uri }
        documentType: { type: ["string", "null"], enum: [link, upload, null] }
        documentName: { type: ["string", "null"] }
      required: [id, petId, type, title, date, clinic, summary, documentUrl, documentType, documentName]
    HealthRecordInput:
      type: object
      properties:
        type: { type: string, enum: [visit, vaccine, lab, procedure, note] }
        title: { type: string, minLength: 1 }
        date: { type: string, format: date }
        clinic: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        # For documentType "link": the pasted external URL.
        documentUrl: { type: ["string", "null"], format: uri }
        # For documentType "upload": the path returned by POST .../documents.
        documentStoragePath: { type: ["string", "null"] }
        documentType: { type: ["string", "null"], enum: [link, upload, null] }
        documentName: { type: ["string", "null"] }
      required: [type, title, date]
    HealthRecordUpdate:
      allOf:
        - $ref: "#/components/schemas/HealthRecordInput"
      description: Updated health record fields
    DocumentUploadResult:
      type: object
      description: path is a private storage key, not a usable URL — see the /documents endpoint description
      properties:
        path: { type: string }
        name: { type: string }
      required: [path, name]
    DocumentUrlResponse:
      type: object
      properties:
        url: { type: string, format: uri }
      required: [url]
    DocumentImportQuota:
      type: object
      description: Onboarding is a one-time 20-document allowance per pet (first 30 days); ongoing is a 10/month allowance per account, separate from any chat quota.
      properties:
        onboardingRemaining: { type: ["integer", "null"], description: "null if the pet's onboarding window has expired or never applied" }
        onboardingLimit: { type: integer }
        ongoingRemaining: { type: integer }
        ongoingLimit: { type: integer }
      required: [onboardingRemaining, onboardingLimit, ongoingRemaining, ongoingLimit]
    DocumentImportItem:
      type: object
      properties:
        id: { type: integer }
        importId: { type: integer }
        itemType: { type: string, enum: [health_record, medication, reminder, vet_info] }
        proposedData:
          type: object
          description: Shape depends on itemType — a HealthRecordInput, MedicationInput, or ReminderInput-shaped object, or for "vet_info" a partial profile-update object with any of vetName/vetClinic/vetPhone/vetAddress/breed/weight/weightUnit/sex (only the fields the source document actually stated and that differ from the pet's current profile; weight and weightUnit are always present together).
        duplicateOfType: { type: ["string", "null"], enum: [health_record, medication, reminder, null] }
        duplicateOfId: { type: ["integer", "null"] }
        status: { type: string, enum: [pending, accepted, rejected] }
        createdRecordId: { type: ["integer", "null"] }
      required: [id, importId, itemType, proposedData, duplicateOfType, duplicateOfId, status, createdRecordId]
    DocumentImport:
      type: object
      description: The source document's storage path is server-internal (not exposed here) — fetch a viewable link via GET .../document-imports/{importId}/document-url.
      properties:
        id: { type: integer }
        petId: { type: integer }
        documentName: { type: string }
        lane: { type: string, enum: [onboarding, ongoing] }
        status: { type: string, enum: [pending_review, reviewed] }
        analyzedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentImportItem"
      required: [id, petId, documentName, lane, status, analyzedAt, items]
    DocumentImportResponse:
      type: object
      description: Quota reflects current account/pet state — not a property of this specific import — so it's a sibling, not embedded per-import.
      properties:
        import:
          $ref: "#/components/schemas/DocumentImport"
        quota:
          $ref: "#/components/schemas/DocumentImportQuota"
      required: [import, quota]
    DocumentImportListResponse:
      type: object
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/DocumentImport"
        quota:
          $ref: "#/components/schemas/DocumentImportQuota"
      required: [imports, quota]
    AcceptDocumentImportItemBody:
      type: object
      description: Omit to accept the proposed data as-is; include to accept an edited version instead.
      properties:
        proposedData:
          type: object
      required: []
    Medication:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        name: { type: string }
        dose: { type: string }
        frequency: { type: string }
        doseIntervalValue: { type: ["integer", "null"], minimum: 1 }
        doseIntervalUnit: { type: ["string", "null"], enum: [hours, days, weeks, months, null] }
        nextDoseAt: { type: ["string", "null"], format: date-time }
        active: { type: boolean }
        instructions: { type: ["string", "null"] }
      required: [id, petId, name, dose, frequency, doseIntervalValue, doseIntervalUnit, nextDoseAt, active, instructions]
    MedicationInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        dose: { type: string, minLength: 1 }
        frequency: { type: string, minLength: 1 }
        doseIntervalValue: { type: ["integer", "null"], minimum: 1 }
        doseIntervalUnit: { type: ["string", "null"], enum: [hours, days, weeks, months, null] }
        nextDoseAt: { type: ["string", "null"], format: date-time }
        active: { type: boolean }
        instructions: { type: ["string", "null"] }
      required: [name, dose, frequency, active]
    MedicationUpdate:
      allOf:
        - $ref: "#/components/schemas/MedicationInput"
      description: Updated medication fields
    WeightLog:
      type: object
      description: Auto-recorded whenever a pet's weight is set or changed via the pet create/update routes — no separate logging action.
      properties:
        id: { type: integer }
        petId: { type: integer }
        weight: { type: number }
        weightUnit: { type: string, enum: [lb, kg] }
        recordedAt: { type: string, format: date-time }
      required: [id, petId, weight, weightUnit, recordedAt]
    MedicationAdherence:
      type: object
      description: Frequency-based over the trailing 30 days — doses logged ÷ doses expected from the medication's structured interval, capped at 100%. Only computed for active medications with a structured interval set.
      properties:
        medicationId: { type: integer }
        medicationName: { type: string }
        adherencePercent: { type: integer, minimum: 0, maximum: 100 }
        dosesLogged: { type: integer }
        dosesExpected: { type: integer }
      required: [medicationId, medicationName, adherencePercent, dosesLogged, dosesExpected]
    PetTrends:
      type: object
      properties:
        weightLogs:
          type: array
          items: { $ref: "#/components/schemas/WeightLog" }
        medicationAdherence:
          type: array
          items: { $ref: "#/components/schemas/MedicationAdherence" }
      required: [weightLogs, medicationAdherence]
    VaccineStatus:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        status: { type: string, enum: [current, overdue, never_recorded] }
        lastGivenDate: { type: ["string", "null"], format: date }
        dueDate: { type: ["string", "null"], format: date }
      required: [key, label, status, lastGivenDate, dueDate]
    PetVaccines:
      type: object
      properties:
        vaccines:
          type: array
          items: { $ref: "#/components/schemas/VaccineStatus" }
      required: [vaccines]
    Reminder:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        title: { type: string }
        dueDate: { type: string, format: date }
        category: { type: string, enum: [appointment, vaccine, medication, wellness, other] }
        completed: { type: boolean }
        note: { type: ["string", "null"] }
        source: { type: string, enum: [owner, system] }
        ruleId: { type: ["string", "null"] }
      required: [id, petId, title, dueDate, category, completed, note, source, ruleId]
    ReminderInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        dueDate: { type: string, format: date }
        category: { type: string, enum: [appointment, vaccine, medication, wellness, other] }
        note: { type: ["string", "null"] }
      required: [title, dueDate, category]
    Insight:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        title: { type: string }
        content: { type: string }
        question: { type: string, description: "The owner's original question." }
        tone: { type: string, enum: [helpful, watch, urgent] }
        source: { type: string, enum: [ai, record, reminder] }
        createdAt: { type: string, format: date-time }
        disclaimer: { type: string }
        kind: { type: string, enum: [chat, escalation, emergency_vet_result], description: "Whether a red flag short-circuited this to an escalation response, or (after a zipcode reply to one) a looked-up list of nearby emergency vets." }
        metadata:
          description: Structured payload for kinds that need more than plain text. Currently only set for emergency_vet_result; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/EmergencyVetMetadata"
            - type: "null"
        dismissedAt: { type: ["string", "null"], format: date-time, description: "Set once the owner dismisses this insight's active-emergency dashboard banner. Null for every plain chat turn, which has no such banner." }
        action:
          description: Set when Pawlie proposed a conversational action alongside this reply (e.g. "add a reminder for..."). Null for a plain answer with nothing to confirm.
          oneOf:
            - $ref: "#/components/schemas/AiAction"
            - type: "null"
      required: [id, petId, title, content, question, tone, source, createdAt, disclaimer, kind, metadata, dismissedAt, action]
    EmergencyVetMetadata:
      type: object
      description: Nearby emergency vet clinics found via web search, plus an AI-generated call script grounded in the pet's described symptoms. Never asserts a clinic is currently open — always call-ahead framed.
      properties:
        vets:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              phone: { type: string }
              address: { type: ["string", "null"] }
            required: [name, phone, address]
        script: { type: string }
      required: [vets, script]
    AiAction:
      type: object
      description: A conversational edit Pawlie proposed — deliberately parallel to DocumentImportItem's review-gated shape. Nothing is written until the owner confirms.
      properties:
        id: { type: integer }
        petId: { type: integer }
        insightId: { type: ["integer", "null"] }
        actionType: { type: string, enum: [create_reminder, complete_reminder, update_pet_profile, log_symptom] }
        proposedData:
          type: object
          description: Shape depends on actionType — a ReminderInput-shaped object for create_reminder, {reminderId} for complete_reminder, a partial profile-update object (same shape as Smart Upload's vet_info item — any of vetName/vetClinic/vetPhone/vetAddress/breed/weight/weightUnit/sex) for update_pet_profile, or {description} for log_symptom.
        status: { type: string, enum: [pending, confirmed, cancelled] }
        appliedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, petId, insightId, actionType, proposedData, status, appliedAt, createdAt]
    ChatQuota:
      type: object
      description: A single account-wide monthly allowance for symptom-chat AI questions (50/month), separate from the document-import lanes in DocumentImportQuota. A red-flag escalation never draws on this.
      properties:
        used: { type: integer }
        limit: { type: integer }
        remaining: { type: integer }
      required: [used, limit, remaining]
    InsightListResponse:
      type: object
      properties:
        insights:
          type: array
          items: { $ref: "#/components/schemas/Insight" }
        quota: { $ref: "#/components/schemas/ChatQuota" }
      required: [insights, quota]
    InsightResponse:
      type: object
      properties:
        insight: { $ref: "#/components/schemas/Insight" }
        quota: { $ref: "#/components/schemas/ChatQuota" }
      required: [insight, quota]
    InsightQuestion:
      type: object
      properties:
        petId: { type: integer }
        question: { type: string, minLength: 1 }
      required: [petId, question]
    SymptomLog:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        description: { type: string }
        loggedAt: { type: string, format: date-time }
        insightId: { type: ["integer", "null"] }
      required: [id, petId, description, loggedAt, insightId]
    SymptomLogInput:
      type: object
      properties:
        description: { type: string, minLength: 1 }
        insightId: { type: ["integer", "null"] }
      required: [description]
    SymptomEntry:
      type: object
      description: A Symptom Journal entry — deliberately separate from SymptomLog (a free-text note saved from a Pawlie chat answer). Every observation field is nullable since an owner logs whatever they actually noticed, not a mandatory checklist.
      properties:
        id: { type: integer }
        petId: { type: integer }
        loggedAt: { type: string, format: date-time }
        appetite: { type: ["string", "null"], enum: [low, normal, high, null] }
        energy: { type: ["string", "null"], enum: [low, normal, high, null] }
        stoolQuality: { type: ["string", "null"], enum: [normal, soft, diarrhea, constipated, null] }
        vomiting: { type: ["boolean", "null"] }
        limping: { type: ["boolean", "null"] }
        behaviorNote: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
      required: [id, petId, loggedAt, appetite, energy, stoolQuality, vomiting, limping, behaviorNote, note]
    SymptomEntryInput:
      type: object
      description: Every field optional — the server rejects a request where all of them are empty, since a completely blank entry isn't worth saving.
      properties:
        appetite: { type: string, enum: [low, normal, high] }
        energy: { type: string, enum: [low, normal, high] }
        stoolQuality: { type: string, enum: [normal, soft, diarrhea, constipated] }
        vomiting: { type: boolean }
        limping: { type: boolean }
        behaviorNote: { type: string, minLength: 1 }
        note: { type: string, minLength: 1 }
    AlertReasoningItem:
      type: object
      description: One contributing signal, rendered through a fixed template — never freeform AI text. historicalDataPoint is always null today; kept in the shape for a real historical-fact source later.
      properties:
        signal: { type: string }
        value: { type: string }
        historicalDataPoint: { type: ["string", "null"] }
        weight: { type: number }
      required: [signal, value, historicalDataPoint, weight]
    Alert:
      type: object
      description: A pure rule-based flag from Predictive Health Monitoring — one row represents a pet's current assessment; re-evaluation after each new Symptom Journal entry updates it in place rather than piling up duplicates. Never contains a symptom-to-medication or symptom-to-diagnosis guess — see docs/PRD.md §7e for why that line is firm.
      properties:
        id: { type: integer }
        petId: { type: integer }
        triggeredByEntryId: { type: ["integer", "null"] }
        severity: { type: string, enum: [yellow, red] }
        confidence: { type: string, enum: [low, medium, high] }
        reasoning:
          type: array
          items: { $ref: "#/components/schemas/AlertReasoningItem" }
        status: { type: string, enum: [active, dismissed, resolved] }
        outcomeNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
      required: [id, petId, triggeredByEntryId, severity, confidence, reasoning, status, outcomeNote, createdAt, resolvedAt]
    DashboardSummary:
      type: object
      properties:
        pet: { $ref: "#/components/schemas/Pet" }
        upcomingReminders:
          type: array
          items: { $ref: "#/components/schemas/Reminder" }
        activeMedications:
          type: array
          items: { $ref: "#/components/schemas/Medication" }
        recentRecords:
          type: array
          items: { $ref: "#/components/schemas/HealthRecord" }
        recentInsights:
          type: array
          items: { $ref: "#/components/schemas/Insight" }
        activeEmergency:
          description: The most recent escalation/emergency_vet_result insight, if it's undismissed and within the last 48 hours. Null otherwise — clears only when the owner dismisses it, not on a timer.
          oneOf:
            - $ref: "#/components/schemas/Insight"
            - type: "null"
        stats:
          type: object
          properties:
            recordCount: { type: integer }
            activeMedicationCount: { type: integer }
            upcomingReminderCount: { type: integer }
          required: [recordCount, activeMedicationCount, upcomingReminderCount]
      required: [pet, upcomingReminders, activeMedications, recentRecords, recentInsights, activeEmergency, stats]


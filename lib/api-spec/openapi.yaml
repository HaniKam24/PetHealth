openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pets
    description: Pet profiles and care data
  - name: dashboard
    description: Owner dashboard summaries
  - name: insights
    description: AI-assisted care guidance
  - name: smart-upload
    description: Smart Document Upload — AI-extracted, owner-reviewed record proposals
  - name: share
    description: Public, unauthenticated sitter/boarding care-report links
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: Created pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/PetLimitReached"
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      summary: Get a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePet
      tags: [pets]
      summary: Update a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetUpdate"
      responses:
        "200":
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Delete a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "204":
          description: Pet deleted
  /pets/{petId}/records:
    get:
      operationId: listHealthRecords
      tags: [pets]
      summary: List health records for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Health records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthRecord"
    post:
      operationId: createHealthRecord
      tags: [pets]
      summary: Add a health record
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordInput"
      responses:
        "201":
          description: Created health record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
  /pets/{petId}/records/{recordId}:
    patch:
      operationId: updateHealthRecord
      tags: [pets]
      summary: Update a health record
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/HealthRecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordUpdate"
      responses:
        "200":
          description: Updated health record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHealthRecord
      tags: [pets]
      summary: Delete a health record
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/HealthRecordId"
      responses:
        "204":
          description: Health record deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/documents:
    post:
      operationId: uploadHealthRecordDocument
      tags: [pets]
      summary: Upload a health record document (PDF or image, 10MB max)
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Uploaded document — path is a private storage key, not a usable URL by itself; attach it to a record via documentStoragePath, then fetch a viewable link on demand from GET .../document-url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResult"
        "400":
          description: File missing, too large, or an unsupported type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/photo:
    post:
      operationId: uploadPetPhoto
      tags: [pets]
      summary: Upload a pet's profile photo (JPEG/PNG/WEBP/HEIC, 10MB max) — replaces any existing photo
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Updated pet, with photoUrl pointing at the new photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          description: File missing, too large, or an unsupported type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removePetPhoto
      tags: [pets]
      summary: Remove a pet's uploaded photo — falls back to the species illustration
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Updated pet, with photoUrl cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/records/{recordId}/document-url:
    get:
      operationId: getHealthRecordDocumentUrl
      tags: [pets]
      summary: Get a viewable link for a health record's attached document — a fresh short-lived signed URL for an uploaded file, or the stored link as-is for a pasted one
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/HealthRecordId"
      responses:
        "200":
          description: A link the client can open immediately; expires soon for uploaded documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUrlResponse"
        "404":
          description: Record not found, or it has no attached document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}/document-imports:
    get:
      operationId: listDocumentImports
      tags: [smart-upload]
      summary: List Smart Document Upload imports for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Document imports and the account/pet's current upload quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createDocumentImport
      tags: [smart-upload]
      summary: Upload a vet report for AI extraction (PDF or image, 10MB max, 20 pages max)
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Analyzed document with proposed items awaiting review, and the account/pet's quota after this upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportResponse"
        "400":
          description: File missing/too large/unsupported/too many pages/scanned/wrong pet, or the account's import quota is used up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportUploadError"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports/{importId}:
    get:
      operationId: getDocumentImport
      tags: [smart-upload]
      summary: Get one document import and its proposed items
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/DocumentImportId"
      responses:
        "200":
          description: Document import and the account/pet's current upload quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports/{importId}/document-url:
    get:
      operationId: getDocumentImportDocumentUrl
      tags: [smart-upload]
      summary: Get a fresh short-lived viewable link for a document import's source file
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/DocumentImportId"
      responses:
        "200":
          description: A link the client can open immediately; expires soon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUrlResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports/{importId}/items/{itemId}/accept:
    post:
      operationId: acceptDocumentImportItem
      tags: [smart-upload]
      summary: Accept a proposed item — writes it to the pet's real records
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/DocumentImportId"
        - $ref: "#/components/parameters/DocumentImportItemId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptDocumentImportItemBody"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportItem"
        "400":
          description: The edited data didn't match the expected shape for this item type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports/{importId}/items/{itemId}/reject:
    post:
      operationId: rejectDocumentImportItem
      tags: [smart-upload]
      summary: Reject a proposed item — nothing is written
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/DocumentImportId"
        - $ref: "#/components/parameters/DocumentImportItemId"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportItem"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/medications:
    get:
      operationId: listMedications
      tags: [pets]
      summary: List medications for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Medications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medication"
    post:
      operationId: createMedication
      tags: [pets]
      summary: Add a medication
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationInput"
      responses:
        "201":
          description: Created medication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
  /pets/{petId}/medications/{medicationId}:
    patch:
      operationId: updateMedication
      tags: [pets]
      summary: Update a medication
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/MedicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationUpdate"
      responses:
        "200":
          description: Updated medication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMedication
      tags: [pets]
      summary: Delete a medication
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/MedicationId"
      responses:
        "204":
          description: Medication deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/medications/{medicationId}/log-dose:
    post:
      operationId: logMedicationDose
      tags: [pets]
      summary: Mark a dose given and auto-calculate the next dose from the medication's interval
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/MedicationId"
      responses:
        "200":
          description: Medication with updated next-dose time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "400":
          description: Medication has no structured interval to calculate from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/trends:
    get:
      operationId: getPetTrends
      tags: [pets]
      summary: Get weight history and medication adherence trends for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Trend data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetTrends"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/vaccines:
    get:
      operationId: getPetVaccines
      tags: [pets]
      summary: Get per-vaccine-type status (current/overdue/never recorded) for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Vaccine statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetVaccines"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/reminders:
    get:
      operationId: listReminders
      tags: [pets]
      summary: List reminders for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: createReminder
      tags: [pets]
      summary: Add a reminder
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Created reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /pets/{petId}/symptom-logs:
    get:
      operationId: listSymptomLogs
      tags: [pets]
      summary: List symptom log entries for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Symptom logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymptomLog"
    post:
      operationId: createSymptomLog
      tags: [pets]
      summary: Add a symptom log entry, optionally confirmed from an AI insight
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymptomLogInput"
      responses:
        "201":
          description: Created symptom log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomLog"
  /pets/{petId}/symptom-entries:
    get:
      operationId: listSymptomEntries
      tags: [pets]
      summary: List Symptom Journal entries for a pet, most recent first
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Symptom journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SymptomEntry"
    post:
      operationId: createSymptomEntry
      tags: [pets]
      summary: Add a Symptom Journal entry — a structured, dated observation (appetite, energy, stool, vomiting, limping, notes), distinct from a symptom log saved from a Pawlie chat answer
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymptomEntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomEntry"
        "400":
          description: Every field was empty — log at least one observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}/symptom-entries/{entryId}:
    delete:
      operationId: deleteSymptomEntry
      tags: [pets]
      summary: Delete a Symptom Journal entry (e.g. a mis-tap)
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/SymptomEntryId"
      responses:
        "204":
          description: Entry deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/alerts:
    get:
      operationId: listAlerts
      tags: [pets]
      summary: List Predictive Health Monitoring alerts for a pet (active first, most recent first)
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }
  /pets/{petId}/alerts/{alertId}/dismiss:
    post:
      operationId: dismissAlert
      tags: [pets]
      summary: Dismiss an active alert — the owner has seen it and doesn't need it surfaced anymore
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          $ref: "#/components/responses/NotFound"
  /reminders/{reminderId}/complete:
    post:
      operationId: completeReminder
      tags: [pets]
      summary: Complete a reminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Completed reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the owner dashboard summary
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /pets/{petId}/insights/{insightId}/dismiss:
    post:
      operationId: dismissInsight
      tags: [insights]
      summary: Dismiss an active-emergency dashboard banner (escalation or emergency_vet_result insight)
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/InsightId"
      responses:
        "200":
          description: Updated insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insight"
  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List recent AI insights
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: Recent insights and the account's current monthly chat quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightListResponse"
    post:
      operationId: askInsight
      tags: [insights]
      summary: Ask AI for owner-safe care guidance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightQuestion"
      responses:
        "200":
          description: AI guidance and the account's chat quota after this question. A red-flag escalation never draws on the quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightResponse"
        "400":
          description: Account has used all of this month's AI chat questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}/ai-actions/{actionId}/confirm:
    post:
      operationId: confirmAiAction
      tags: [insights]
      summary: Confirm a Pawlie-proposed action — writes it to the pet's real records
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/AiActionId"
      responses:
        "200":
          description: Updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
        "400":
          description: The action is no longer pending, or its stored data no longer matches the expected shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/ai-actions/{actionId}/cancel:
    post:
      operationId: cancelAiAction
      tags: [insights]
      summary: Cancel a Pawlie-proposed action — nothing is written
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/AiActionId"
      responses:
        "200":
          description: Updated action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAction"
        "400":
          description: The action is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/share-link:
    get:
      operationId: getShareLink
      tags: [pets]
      summary: Get the pet's current active sitter/boarding share link, if any
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: The active share link, or null if none is active
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShareLink"
                  - type: "null"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createShareLink
      tags: [pets]
      summary: Create a new sitter/boarding share link — revokes any existing active link for this pet first
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkBody"
      responses:
        "201":
          description: The created share link, including its full shareable URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "400":
          description: expiresAt isn't after startsAt, or the range exceeds the maximum allowed duration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: revokeShareLink
      tags: [pets]
      summary: Revoke the pet's current active share link
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "204":
          description: Revoked (or there was nothing active to revoke)
        "404":
          $ref: "#/components/responses/NotFound"
  /share/{token}:
    get:
      operationId: getSitterReport
      tags: [share]
      summary: Public, unauthenticated read of a sitter/boarding care report — the token itself is the only credential
      parameters:
        - $ref: "#/components/parameters/ShareToken"
      responses:
        "200":
          description: The care report for the pet this token was issued for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitterReport"
        "404":
          description: The token doesn't exist, was revoked, or is outside its valid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PetIdQuery:
      name: petId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    HealthRecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MedicationId:
      name: medicationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DocumentImportId:
      name: importId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DocumentImportItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SymptomEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AiActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: integer
    InsightId:
      name: insightId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ShareToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PetLimitReached:
      description: Account has reached its pet limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string

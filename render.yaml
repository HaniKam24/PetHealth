# Render Blueprint — defines the two services that make up the always-on
# preview: the Express API and the React (Vite) frontend. Render redeploys
# both automatically on every push to main.
#
# One-time setup (do this in the Render dashboard, not in code):
#   1. New -> Blueprint -> connect this GitHub repo -> Render finds this file.
#   2. Render creates both services below. For each "sync: false" env var,
#      Render will prompt you to paste in the real value (these are secrets
#      and are never committed to git).
#   3. After the first deploy, note the frontend's URL (e.g.
#      https://pethealth-frontend.onrender.com) — that's the link to bookmark.
#
# See docs/deploying-to-render.md for the full walkthrough.

services:
  # Express API (artifacts/api-server) — talks to Supabase and Anthropic,
  # and handles auth itself via better-auth (session cookies, no external
  # auth provider).
  - type: web
    name: pethealth-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    # No manual `corepack enable`/`prepare` here — Render's build image
    # ships Corepack already enabled, and it reads the pinned pnpm version
    # from the "packageManager" field in the root package.json. Manually
    # running `corepack enable` on the static site's build image fails
    # (EROFS: read-only file system, unlink '/usr/bin/pnpm') because that
    # image already has pnpm linked at a path Corepack can't rewrite.
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm -r --filter "@workspace/api-server..." run build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      # PORT is provided automatically by Render — the app already reads it.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # better-auth needs its own public URL for cookies/CSRF — this is
      # this same service's Render URL, not localhost.
      - key: BETTER_AUTH_URL
        value: https://pethealth-api-68wo.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Filled in with the frontend's Render URL once it's known, so the
      # API accepts direct cross-origin requests from it too (the static
      # site's rewrite rule below is the primary path, this is a fallback).
      - key: WEB_ORIGIN
        sync: false

  # Vite/React frontend (artifacts/pet-health-companion) — this is the link
  # you bookmark and click to see the latest pushed version.
  - type: web
    runtime: static
    name: pethealth-frontend
    branch: main
    autoDeploy: true
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm -r --filter "@workspace/pet-health-companion..." run build
    staticPublishPath: artifacts/pet-health-companion/dist/public
    routes:
      # Same-origin API calls: the app's code calls relative /api/... paths.
      # This proxies those through to the API service above so the browser
      # never has to deal with cross-origin requests.
      - type: rewrite
        source: /api/*
        destination: https://pethealth-api-68wo.onrender.com/api/*
      # Client-side routing (wouter) — unmatched paths fall back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html

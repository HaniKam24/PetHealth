openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: pets
    description: Pet profiles and care data
  - name: dashboard
    description: Owner dashboard summaries
  - name: insights
    description: AI-assisted care guidance
  - name: smart-upload
    description: Smart Document Upload — AI-extracted, owner-reviewed record proposals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      tags: [pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: Created pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/PetLimitReached"
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      summary: Get a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePet
      tags: [pets]
      summary: Update a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetUpdate"
      responses:
        "200":
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Delete a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "204":
          description: Pet deleted
  /pets/{petId}/records:
    get:
      operationId: listHealthRecords
      tags: [pets]
      summary: List health records for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Health records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthRecord"
    post:
      operationId: createHealthRecord
      tags: [pets]
      summary: Add a health record
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordInput"
      responses:
        "201":
          description: Created health record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
  /pets/{petId}/records/{recordId}:
    patch:
      operationId: updateHealthRecord
      tags: [pets]
      summary: Update a health record
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/HealthRecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthRecordUpdate"
      responses:
        "200":
          description: Updated health record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRecord"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteHealthRecord
      tags: [pets]
      summary: Delete a health record
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/HealthRecordId"
      responses:
        "204":
          description: Health record deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/documents:
    post:
      operationId: uploadHealthRecordDocument
      tags: [pets]
      summary: Upload a health record document (PDF or image, 10MB max)
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Uploaded document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResult"
        "400":
          description: File missing, too large, or an unsupported type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports:
    get:
      operationId: listDocumentImports
      tags: [smart-upload]
      summary: List Smart Document Upload imports for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Document imports and the account/pet's current upload quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createDocumentImport
      tags: [smart-upload]
      summary: Upload a vet report for AI extraction (PDF or image, 10MB max, 20 pages max)
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Analyzed document with proposed items awaiting review, and the account/pet's quota after this upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportResponse"
        "400":
          description: File missing/too large/unsupported/too many pages/scanned, or the account's import quota is used up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports/{importId}:
    get:
      operationId: getDocumentImport
      tags: [smart-upload]
      summary: Get one document import and its proposed items
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/DocumentImportId"
      responses:
        "200":
          description: Document import and the account/pet's current upload quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports/{importId}/items/{itemId}/accept:
    post:
      operationId: acceptDocumentImportItem
      tags: [smart-upload]
      summary: Accept a proposed item — writes it to the pet's real records
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/DocumentImportId"
        - $ref: "#/components/parameters/DocumentImportItemId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptDocumentImportItemBody"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportItem"
        "400":
          description: The edited data didn't match the expected shape for this item type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/document-imports/{importId}/items/{itemId}/reject:
    post:
      operationId: rejectDocumentImportItem
      tags: [smart-upload]
      summary: Reject a proposed item — nothing is written
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/DocumentImportId"
        - $ref: "#/components/parameters/DocumentImportItemId"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentImportItem"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/medications:
    get:
      operationId: listMedications
      tags: [pets]
      summary: List medications for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Medications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medication"
    post:
      operationId: createMedication
      tags: [pets]
      summary: Add a medication
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationInput"
      responses:
        "201":
          description: Created medication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
  /pets/{petId}/medications/{medicationId}:
    patch:
      operationId: updateMedication
      tags: [pets]
      summary: Update a medication
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/MedicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicationUpdate"
      responses:
        "200":
          description: Updated medication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/medications/{medicationId}/log-dose:
    post:
      operationId: logMedicationDose
      tags: [pets]
      summary: Mark a dose given and auto-calculate the next dose from the medication's interval
      parameters:
        - $ref: "#/components/parameters/PetId"
        - $ref: "#/components/parameters/MedicationId"
      responses:
        "200":
          description: Medication with updated next-dose time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medication"
        "400":
          description: Medication has no structured interval to calculate from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /pets/{petId}/reminders:
    get:
      operationId: listReminders
      tags: [pets]
      summary: List reminders for a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: createReminder
      tags: [pets]
      summary: Add a reminder
      parameters:
        - $ref: "#/components/parameters/PetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Created reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /reminders/{reminderId}/complete:
    post:
      operationId: completeReminder
      tags: [pets]
      summary: Complete a reminder
      parameters:
        - $ref: "#/components/parameters/ReminderId"
      responses:
        "200":
          description: Completed reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the owner dashboard summary
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: List recent AI insights
      parameters:
        - $ref: "#/components/parameters/PetIdQuery"
      responses:
        "200":
          description: Recent insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"
    post:
      operationId: askInsight
      tags: [insights]
      summary: Ask AI for owner-safe care guidance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightQuestion"
      responses:
        "200":
          description: AI guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insight"
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PetIdQuery:
      name: petId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    ReminderId:
      name: reminderId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    HealthRecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MedicationId:
      name: medicationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DocumentImportId:
      name: importId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DocumentImportItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PetLimitReached:
      description: Account has reached its pet limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Pet:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        species: { type: string, enum: [dog, cat, bird, rabbit, other] }
        breed: { type: ["string", "null"] }
        sex: { type: string, enum: [female, male, unknown] }
        birthDate: { type: ["string", "null"], format: date }
        weight: { type: ["number", "null"] }
        weightUnit: { type: string, enum: [lb, kg] }
        photoUrl: { type: ["string", "null"], format: uri }
        notes: { type: ["string", "null"] }
        vetName: { type: ["string", "null"] }
        vetClinic: { type: ["string", "null"] }
        vetPhone: { type: ["string", "null"] }
        vetAddress: { type: ["string", "null"] }
      required: [id, name, species, breed, sex, birthDate, weight, weightUnit, photoUrl, notes, vetName, vetClinic, vetPhone, vetAddress]
    PetInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        species: { type: string, enum: [dog, cat, bird, rabbit, other] }
        breed: { type: ["string", "null"] }
        sex: { type: string, enum: [female, male, unknown] }
        birthDate: { type: ["string", "null"], format: date }
        weight: { type: ["number", "null"] }
        weightUnit: { type: string, enum: [lb, kg] }
        photoUrl: { type: ["string", "null"], format: uri }
        notes: { type: ["string", "null"] }
        vetName: { type: ["string", "null"] }
        vetClinic: { type: ["string", "null"] }
        vetPhone: { type: ["string", "null"] }
        vetAddress: { type: ["string", "null"] }
      required: [name, species, sex, weightUnit]
    PetUpdate:
      allOf:
        - $ref: "#/components/schemas/PetInput"
      description: Updated pet fields
    HealthRecord:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        type: { type: string, enum: [visit, vaccine, lab, procedure, note] }
        title: { type: string }
        date: { type: string, format: date }
        clinic: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        documentUrl: { type: ["string", "null"], format: uri }
        documentType: { type: ["string", "null"], enum: [link, upload, null] }
        documentName: { type: ["string", "null"] }
      required: [id, petId, type, title, date, clinic, summary, documentUrl, documentType, documentName]
    HealthRecordInput:
      type: object
      properties:
        type: { type: string, enum: [visit, vaccine, lab, procedure, note] }
        title: { type: string, minLength: 1 }
        date: { type: string, format: date }
        clinic: { type: ["string", "null"] }
        summary: { type: ["string", "null"] }
        documentUrl: { type: ["string", "null"], format: uri }
        documentType: { type: ["string", "null"], enum: [link, upload, null] }
        documentName: { type: ["string", "null"] }
      required: [type, title, date]
    HealthRecordUpdate:
      allOf:
        - $ref: "#/components/schemas/HealthRecordInput"
      description: Updated health record fields
    DocumentUploadResult:
      type: object
      properties:
        url: { type: string, format: uri }
        name: { type: string }
      required: [url, name]
    DocumentImportQuota:
      type: object
      description: Onboarding is a one-time 20-document allowance per pet (first 30 days); ongoing is a 10/month allowance per account, separate from any chat quota.
      properties:
        onboardingRemaining: { type: ["integer", "null"], description: "null if the pet's onboarding window has expired or never applied" }
        onboardingLimit: { type: integer }
        ongoingRemaining: { type: integer }
        ongoingLimit: { type: integer }
      required: [onboardingRemaining, onboardingLimit, ongoingRemaining, ongoingLimit]
    DocumentImportItem:
      type: object
      properties:
        id: { type: integer }
        importId: { type: integer }
        itemType: { type: string, enum: [health_record, medication, reminder] }
        proposedData:
          type: object
          description: Shape depends on itemType — a HealthRecordInput, MedicationInput, or ReminderInput-shaped object.
        duplicateOfType: { type: ["string", "null"], enum: [health_record, medication, reminder, null] }
        duplicateOfId: { type: ["integer", "null"] }
        status: { type: string, enum: [pending, accepted, rejected] }
        createdRecordId: { type: ["integer", "null"] }
      required: [id, importId, itemType, proposedData, duplicateOfType, duplicateOfId, status, createdRecordId]
    DocumentImport:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        sourceDocumentUrl: { type: string, format: uri }
        documentName: { type: string }
        lane: { type: string, enum: [onboarding, ongoing] }
        status: { type: string, enum: [pending_review, reviewed] }
        analyzedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/DocumentImportItem"
      required: [id, petId, sourceDocumentUrl, documentName, lane, status, analyzedAt, items]
    DocumentImportResponse:
      type: object
      description: Quota reflects current account/pet state — not a property of this specific import — so it's a sibling, not embedded per-import.
      properties:
        import:
          $ref: "#/components/schemas/DocumentImport"
        quota:
          $ref: "#/components/schemas/DocumentImportQuota"
      required: [import, quota]
    DocumentImportListResponse:
      type: object
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/DocumentImport"
        quota:
          $ref: "#/components/schemas/DocumentImportQuota"
      required: [imports, quota]
    AcceptDocumentImportItemBody:
      type: object
      description: Omit to accept the proposed data as-is; include to accept an edited version instead.
      properties:
        proposedData:
          type: object
      required: []
    Medication:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        name: { type: string }
        dose: { type: string }
        frequency: { type: string }
        doseIntervalValue: { type: ["integer", "null"], minimum: 1 }
        doseIntervalUnit: { type: ["string", "null"], enum: [hours, days, weeks, months, null] }
        nextDoseAt: { type: ["string", "null"], format: date-time }
        active: { type: boolean }
        instructions: { type: ["string", "null"] }
      required: [id, petId, name, dose, frequency, doseIntervalValue, doseIntervalUnit, nextDoseAt, active, instructions]
    MedicationInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        dose: { type: string, minLength: 1 }
        frequency: { type: string, minLength: 1 }
        doseIntervalValue: { type: ["integer", "null"], minimum: 1 }
        doseIntervalUnit: { type: ["string", "null"], enum: [hours, days, weeks, months, null] }
        nextDoseAt: { type: ["string", "null"], format: date-time }
        active: { type: boolean }
        instructions: { type: ["string", "null"] }
      required: [name, dose, frequency, active]
    MedicationUpdate:
      allOf:
        - $ref: "#/components/schemas/MedicationInput"
      description: Updated medication fields
    Reminder:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        title: { type: string }
        dueDate: { type: string, format: date }
        category: { type: string, enum: [appointment, vaccine, medication, wellness, other] }
        completed: { type: boolean }
        note: { type: ["string", "null"] }
        source: { type: string, enum: [owner, system] }
        ruleId: { type: ["string", "null"] }
      required: [id, petId, title, dueDate, category, completed, note, source, ruleId]
    ReminderInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        dueDate: { type: string, format: date }
        category: { type: string, enum: [appointment, vaccine, medication, wellness, other] }
        note: { type: ["string", "null"] }
      required: [title, dueDate, category]
    Insight:
      type: object
      properties:
        id: { type: integer }
        petId: { type: integer }
        title: { type: string }
        content: { type: string }
        tone: { type: string, enum: [helpful, watch, urgent] }
        source: { type: string, enum: [ai, record, reminder] }
        createdAt: { type: string, format: date-time }
        disclaimer: { type: string }
      required: [id, petId, title, content, tone, source, createdAt, disclaimer]
    InsightQuestion:
      type: object
      properties:
        petId: { type: integer }
        question: { type: string, minLength: 1 }
      required: [petId, question]
    DashboardSummary:
      type: object
      properties:
        pet: { $ref: "#/components/schemas/Pet" }
        upcomingReminders:
          type: array
          items: { $ref: "#/components/schemas/Reminder" }
        activeMedications:
          type: array
          items: { $ref: "#/components/schemas/Medication" }
        recentRecords:
          type: array
          items: { $ref: "#/components/schemas/HealthRecord" }
        recentInsights:
          type: array
          items: { $ref: "#/components/schemas/Insight" }
        stats:
          type: object
          properties:
            recordCount: { type: integer }
            activeMedicationCount: { type: integer }
            upcomingReminderCount: { type: integer }
          required: [recordCount, activeMedicationCount, upcomingReminderCount]
      required: [pet, upcomingReminders, activeMedications, recentRecords, recentInsights, stats]

